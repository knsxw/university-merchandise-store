services:
  # Do not publish internal services directly in production. All browser traffic
  # enters through the Nginx reverse proxy.
  mysql:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      NODE_ENV: production
    volumes: !reset
      - backend_uploads:/app/uploads

  frontend:
    ports: !reset []

  nginx:
    ports:
      - "443:443"
    volumes:
      - ${NGINX_CONFIG_PATH:-./nginx.prod.conf}:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - |
        (while sleep 6h; do nginx -t && nginx -s reload; done) &
        exec nginx -g 'daemon off;'
